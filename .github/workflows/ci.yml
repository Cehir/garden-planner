name: CI

on:
  pull_request:
  push:
    branches: [main]
  # audit.yml startet CI für seinen PR so (GITHUB_TOKEN löst kein pull_request aus)
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben PR bricht den alten Lauf ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (Typprüfung)
        run: npm run build

      # Browser-Cache pro Playwright-Version; Systembibliotheken kommen bei jedem Lauf per apt
      - name: Playwright-Version ermitteln
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Systembibliotheken für Chromium installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E-Tests
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
